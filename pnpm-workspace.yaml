packages:
  - "examples/*"
  - "examples/*/src-web"

allowBuilds:
  tree-sitter: true
  tree-sitter-gdscript: true
  tree-sitter-godot-resource: true
  vue-demi: false

catalog:
  "@antfu/eslint-config": ^10.0.0
  "@moeru/eventa": ^1.0.2
  "@types/node": ^26.6.6
  bumpp: ^12.3.0
  execa: ^10.2.1
  eslint: ^10.13.0
  eslint-plugin-format: ^2.0.1
  typescript: ^6.0.3
  typescript-to-gdscript: ^0.1.12
  vite: ^8.3.5

minimumReleaseAgeExclude:
  - '@gd-kirie/build@0.16.0'
  - '@gd-kirie/ipc-eventa@0.16.0'
  - '@gd-kirie/ipc@0.16.0'
  - '@gd-kirie/tray@0.15.0'
  - kirie@0.16.0
  - '@gd-kirie/notifications@0.15.0'
  - '@gd-kirie/platform@0.16.0'
  - '@gd-kirie/qr@0.15.0'
  - '@proj-airi/ui@0.14.0'
  - '@vue/language-core@3.3.14'
  - vue-tsc@3.3.14
  - '@proj-airi/unocss-preset-chromatic@2.0.1'
