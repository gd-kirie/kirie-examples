[preset.0]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="src-web/dist/*,src-web/dist/**/*"
exclude_filter="node_modules/*,node_modules/**/*,src-web/index.html,src-web/src/*,src-web/src/**/*,package.json,tsconfig.json,kirie.config.ts,uno.config.ts"
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="ai.moeru.kirie.examples.qr"
permissions/camera=true
dotnet/include_debug_symbols=true

[preset.1]

name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
include_filter="src-web/dist/*,src-web/dist/**/*"
exclude_filter="node_modules/*,node_modules/**/*,src-web/index.html,src-web/src/*,src-web/src/**/*,package.json,tsconfig.json,kirie.config.ts,uno.config.ts"
script_export_mode=2

[preset.1.options]

architectures/arm64=true
application/bundle_identifier="ai.moeru.kirie.examples.qr"
application/export_project_only=true
privacy/camera_usage_description="Scan a QR code with the camera."
application/min_ios_version="16.0"
